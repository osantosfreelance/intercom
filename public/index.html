<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0d1b2a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>intercom</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>

  <!-- ── Join Screen ──────────────────────────────────────────────────── -->
  <div id="screen-join" class="screen active">
    <div class="join-card">
      <header class="app-header">
        <h1>intercom</h1>
        <p class="tagline">Push-to-talk group session</p>
      </header>

      <div class="form-group">
        <label for="input-alias">Your alias</label>
        <input id="input-alias" type="text" maxlength="32" placeholder="e.g. Alex W." autocomplete="off" />
      </div>

      <div class="form-group">
        <label for="input-code">Session code</label>
        <input id="input-code" type="text" placeholder="Enter session code" autocomplete="off" />
      </div>

      <p id="join-error" class="error-text" hidden></p>

      <button id="btn-join" class="btn btn-primary btn-full">Join Session</button>
    </div>

    <footer class="app-footer">
      <span>&copy; powered by osantosfreelance</span>
    </footer>
  </div>

  <!-- ── Session Screen ───────────────────────────────────────────────── -->
  <div id="screen-session" class="screen">
    <!-- PTT overlay: covers the entire screen except the action bar -->
    <div id="ptt-zone" aria-hidden="true"></div>

    <header class="session-header">
      <span id="session-label" class="session-label">tech-be-townhall-2k26</span>
      <span id="ptt-indicator" class="ptt-indicator" hidden>🎙 Speaking…</span>
    </header>

    <div id="participants-grid" class="participants-grid"></div>

    <!-- Push-to-talk hint -->
    <p class="ptt-hint">Hold anywhere to speak &bull; Release to mute</p>

    <!-- Action bar -->
    <div class="action-bar">
      <button id="btn-exit" class="btn btn-danger action-btn" aria-label="Exit session">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" width="22" height="22">
          <path d="M16 13v-2H7V8l-5 4 5 4v-3z"/>
          <path d="M20 3H10c-1.1 0-2 .9-2 2v4h2V5h10v14H10v-4H8v4c0 1.1.9 2 2 2h10c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2z"/>
        </svg>
        Exit
      </button>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/app.js"></script>
</body>
</html>
